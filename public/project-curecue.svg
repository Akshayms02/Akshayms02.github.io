<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ecfeff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <circle cx="650" cy="90" r="150" fill="#2dd4bf" fill-opacity="0.2" filter="url(#blur)"/>
  <circle cx="120" cy="420" r="130" fill="#38bdf8" fill-opacity="0.16" filter="url(#blur)"/>
  <rect x="88" y="78" width="624" height="364" rx="28" fill="url(#panel)" stroke="#99f6e4" stroke-opacity="0.28"/>
  <text x="120" y="130" fill="#ccfbf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="4">CURECUE</text>
  <text x="120" y="162" fill="#5eead4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" opacity="0.85">Appointment OS</text>
  <!-- calendar grid -->
  <g transform="translate(120 200)" stroke="#99f6e4" stroke-opacity="0.35">
    <rect width="360" height="180" rx="18" fill="#042f2e" fill-opacity="0.35"/>
    <path d="M0 44H360M90 44V180M180 44V180M270 44V180M0 90H360M0 136H360" />
  </g>
  <g transform="translate(138 256)">
    <rect width="54" height="28" rx="8" fill="#2dd4bf"/>
    <rect x="90" width="54" height="28" rx="8" fill="#99f6e4" fill-opacity="0.35"/>
    <rect x="180" width="54" height="28" rx="8" fill="#99f6e4" fill-opacity="0.2"/>
    <rect x="270" width="54" height="28" rx="8" fill="#2dd4bf" fill-opacity="0.55"/>
    <rect y="46" width="54" height="28" rx="8" fill="#99f6e4" fill-opacity="0.2"/>
    <rect x="90" y="46" width="54" height="28" rx="8" fill="#2dd4bf"/>
    <rect x="180" y="46" width="54" height="28" rx="8" fill="#99f6e4" fill-opacity="0.35"/>
  </g>
  <!-- side stack -->
  <g transform="translate(520 200)">
    <rect width="160" height="52" rx="14" fill="#ecfeff" fill-opacity="0.12"/>
    <rect y="68" width="160" height="52" rx="14" fill="#ecfeff" fill-opacity="0.12"/>
