    <text x="20" y="100" fill="#ccfbf1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Redis Cache</text>
    <text x="20" y="168" fill="#ecfeff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">AWS S3</text>
