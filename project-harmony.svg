<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1033"/>
      <stop offset="45%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="hblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#hbg)"/>
  <circle cx="160" cy="120" r="140" fill="#f472b6" fill-opacity="0.18" filter="url(#hblur)"/>
  <circle cx="640" cy="400" r="160" fill="#a78bfa" fill-opacity="0.18" filter="url(#hblur)"/>
  <rect x="88" y="78" width="624" height="364" rx="28" fill="#fff" fill-opacity="0.05" stroke="#fbcfe8" stroke-opacity="0.22"/>
  <text x="120" y="130" fill="#fce7f3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="3">HARMONY HUE</text>
  <text x="120" y="162" fill="#f9a8d4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" opacity="0.9">Commerce canvas</text>
  <!-- fabric ribbons -->
  <path d="M120 220C220 180 280 280 380 240C480 200 520 300 680 250" stroke="url(#ribbon)" stroke-width="42" stroke-linecap="round" opacity="0.9"/>
  <path d="M140 310C250 270 300 360 420 320C540 280 580 370 700 330" stroke="url(#ribbon)" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <!-- swatches -->
  <g transform="translate(120 370)">
    <rect width="48" height="36" rx="10" fill="#fb7185"/>
    <rect x="60" width="48" height="36" rx="10" fill="#e879f9"/>
    <rect x="120" width="48" height="36" rx="10" fill="#818cf8"/>
    <rect x="180" width="48" height="36" rx="10" fill="#fbbf24"/>
    <rect x="240" width="48" height="36" rx="10" fill="#38bdf8"/>
  </g>
  <g transform="translate(500 200)">
    <rect width="180" height="64" rx="16" fill="#fff" fill-opacity="0.08"/>
    <rect y="80" width="180" height="64" rx="16" fill="#fff" fill-opacity="0.08"/>
    <text x="22" y="38" fill="#fce7f3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Variants · Cart</text>
    <text x="22" y="118" fill="#fce7f3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Razorpay · Orders</text>
  </g>
</svg>
